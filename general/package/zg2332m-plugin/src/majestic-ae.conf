; Configuration AE du plugin zg2332m (hisilicon.so).
; Lue au chargement du plugin et par la commande `profile <nom>`
; (qui applique la section [AE_Plugin_<nom>]).
;
; Cle Boot :
;   current  -> applique CETTE section au chargement (defaut)
;   none     -> ne touche a rien au chargement
;   <nom>    -> applique [AE_Plugin_<nom>]

[AE_Plugin]
Boot         = current

; --- Plafond de gain analogique -------------------------------------------
; 15872 est la valeur interdite : a ce cran le driver SC2235P ecrit 0xff dans
; le registre capteur 0x3301 et l'image se remplit de traits verticaux.
; 15360 est le cran juste en dessous (0x3301 = 0x19, image propre).
MaxAGain     = 15360

; Le gain numerique CAPTEUR est sans effet mesurable sur ce module : l'AE le
; consommerait sans gagner un seul niveau de luminance. On le laisse a 1x pour
; que tout le budget de gain aille au gain numerique ISP, lui bien reel.
MaxDGain     = 1024

; Gain numerique ISP : seul levier de luminosite restant une fois la pose au
; maximum. 8192 = 8x. L'AE ne le consomme que si la scene l'exige.
MaxISPDGain  = 8192

; Plafond systeme = MaxAGain x MaxISPDGain (15 x 8).
SysGainMax   = 122880

; Pose maximale. Le materiel plafonne a 121215 us (4091 lignes, ~8,2 fps) :
; toute valeur superieure est sans effet, 130000 laisse juste la marge.
MaxExptime   = 130000

; Seuil a partir duquel l'AE s'autorise a rallonger la pose. Le garder BAS est
; essentiel : l'AE pousse alors la pose au maximum (photons reels) avant
; d'ajouter du gain numerique. Un seuil haut fait l'inverse et degrade l'image.
GainThreshold= 16384

Compensation = 52
Tolerance    = 4
Speed        = 64
AEMode       = slow_shutter

; --- Chroma ----------------------------------------------------------------
; De nuit l'IR-cut est ouvert : la chroma que reconstruit l'ISP ne porte aucune
; information reelle et son bruit domine l'image (dominante magenta). L'ISP a
; deja une table de saturation par ISO (au8Sat[i] s'applique a ISO 100 << i) :
; on met a zero les entrees a partir de cet ISO. L'image passe donc en
; monochrome exactement quand le gain dit qu'il fait nuit, et reste en couleur
; de jour, sans aucune detection jour/nuit.
;
; ISO mesures : plein jour ~100-800, interieur eclaire ~600, nuit ~7000-24000.
; 3200 laisse la couleur jusqu'au crepuscule.
;
; nightMode.colorToGray de majestic ne fait rien sur cv300 (API cv500).
SatZeroISO   = 3200

; Surcharge brutale, decommenter pour forcer une valeur a tout moment :
; 0 = monochrome en permanence, 255 = saturation maximale.
; Absente ou "auto" -> c'est la table SatZeroISO ci-dessus qui decide.
; Saturation = 0

; --- DRC (compression de dynamique / tone mapping local) -------------------
; L'ISP livre ce module DESACTIVE sur ces cameras (/proc/umap/isp -> "DRC INFO
; En=0" sur toutes les unites), alors meme que le profil IQ sc2235.ini porte
; une section [drc] avec bLinearDrcEnable=1 : majestic ne l'allume jamais, et
; editer cette section ne change donc rien.
;
; C'est le seul levier qui remonte les ombres sans amplifier lineairement comme
; le fait le gain numerique ISP : le gain applique est plus fort dans les zones
; sombres que dans les claires, les hautes lumieres gardent leur marge.
;
; Mesure sur .200 en contre-jour (percentiles de luminance) :
;   off  : p5=16 p25=26 p50=53 p95=254
;   auto : p5=25 p25=45 p50=77 p95=254   <- ombres remontees, blancs intacts
;
; Laisser en "auto" : le firmware derive lui-meme de meilleures limites de gain
; que tout ce qu'on peut forcer a la main. Forcer DRCDarkLimit degrade le
; resultat (p5 retombe de 25 a 20) — mesure, pas suppose.
DRC          = auto

; Reglages fins, a ne toucher qu'en connaissance de cause. Absents = le
; firmware decide. `drc reset` restaure les valeurs d'origine.
; DRCStrength    = 128     ; base du mode auto / valeur du mode manuel [0-255]
; DRCStrengthMax = 128
; DRCStrengthMin = 0
; DRCDarkGain    = 45      ; u8LocalMixingDark [0-128]
; DRCDarkLimit   = 96      ; u16DarkGainLmtY/C [0-133]

; --- Profils de reference (commande `profile <nom>`) -----------------------

; Reglage constructeur d'origine. Reproduit le defaut : a utiliser uniquement
; pour verifier que les traits verticaux reviennent bien.
[AE_Plugin_night_stock]
DRC          = off
SysGainMax   = 61440
MaxAGain     = 15872
MaxDGain     = 1024
MaxISPDGain  = 4096
MaxExptime   = 83000
GainThreshold= 16384
Compensation = 52
Tolerance    = 4
Speed        = 64
AEMode       = slow_shutter

; Repli conservateur : moitie moins de gain numerique, image plus sombre mais
; nettement moins bruitee.
[AE_Plugin_night_safe]
DRC          = auto
SysGainMax   = 61440
MaxAGain     = 15360
MaxDGain     = 1024
MaxISPDGain  = 4096
MaxExptime   = 130000
GainThreshold= 16384
Compensation = 52
Tolerance    = 4
Speed        = 64
AEMode       = slow_shutter

; Jour : pose courte, pas de slow shutter.
[AE_Plugin_day]
DRC          = auto
SysGainMax   = 15360
MaxAGain     = 15360
MaxDGain     = 1024
MaxISPDGain  = 1024
MaxExptime   = 40000
GainThreshold= 16384
Compensation = 52
Tolerance    = 4
Speed        = 64
AEMode       = fix_framerate
