; V2 plugin config for hisilicon.so.
; Parsed at plugin load and via the `profile <name>` command
; (which loads section [AE_Plugin_<name>]).
;
; Boot key controls what gets applied at load:
;   current  -> apply THIS section (default)
;   none     -> touch nothing at boot
;   <name>   -> apply [AE_Plugin_<name>]

[AE_Plugin]
Boot         = current
SysGainMax   = 15360       ; cap 1 cran sous 15872 (cliff colFPN SC2235P)
MaxAGain     = 15872
MaxDGain     = 1024        ; Dgain capteur off (vendeur)
MaxISPDGain  = 4096
MaxExptime   = 200000      ; 200 ms — libère la pose longue pour scènes sombres
GainThreshold= 16384
Compensation = 52
Tolerance    = 4
Speed        = 64
AEMode       = slow_shutter

; -- Autres profils, sélectionnables via `profile <nom>` --

[AE_Plugin_night_stock]
; Valeurs vendeur ZOSI (rétablit le comportement bugué : rayures verticales).
SysGainMax   = 61440
MaxAGain     = 15872
MaxDGain     = 1024
MaxISPDGain  = 4096
MaxExptime   = 83000
GainThreshold= 16384
Compensation = 52
Tolerance    = 4
Speed        = 64
AEMode       = slow_shutter

[AE_Plugin_day_stock]
SysGainMax   = 79360
MaxAGain     = 15872
MaxDGain     = 1024
MaxISPDGain  = 5120
MaxExptime   = 83000
GainThreshold= 18200
Compensation = 52
Tolerance    = 4
Speed        = 64
AEMode       = slow_shutter

[AE_Plugin_night_safe]
; Encore plus prudent — cap 14x, pose bornée à 100 ms.
SysGainMax   = 14336
MaxAGain     = 14336
MaxDGain     = 1024
MaxISPDGain  = 4096
MaxExptime   = 100000
GainThreshold= 14336
Compensation = 52
Tolerance    = 4
Speed        = 64
AEMode       = slow_shutter

; -- Route AE optionnelle, chargée via `route reload` --
; Format: t1:g1,t2:g2,... (t en µs, g en unités MPP 1024=1x)
; À utiliser pour SAUTER le point pathologique 15872 sans tout capper.
;
; [AE_Route]
; Nodes = 40:1024,10000:4096,40000:8192,80000:14336,200000:15360
