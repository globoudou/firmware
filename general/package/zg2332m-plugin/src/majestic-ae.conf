; Configuration AE du plugin zg2332m (hisilicon.so).
; Lue au chargement du plugin et par la commande `profile <nom>`
; (qui applique la section [AE_Plugin_<nom>]).
;
; Cle Boot :
;   current  -> applique CETTE section au chargement (defaut)
;   none     -> ne touche a rien au chargement
;   <nom>    -> applique [AE_Plugin_<nom>]

[AE_Plugin]
Boot         = current

; --- Plafond de gain analogique -------------------------------------------
; 15872 est la valeur interdite : a ce cran le driver SC2235P ecrit 0xff dans
; le registre capteur 0x3301 et l'image se remplit de traits verticaux.
; 15360 est le cran juste en dessous (0x3301 = 0x19, image propre).
MaxAGain     = 15360

; Le gain numerique CAPTEUR est sans effet mesurable sur ce module : l'AE le
; consommerait sans gagner un seul niveau de luminance. On le laisse a 1x pour
; que tout le budget de gain aille au gain numerique ISP, lui bien reel.
MaxDGain     = 1024

; Gain numerique ISP : seul levier de luminosite restant une fois la pose au
; maximum. 8192 = 8x. L'AE ne le consomme que si la scene l'exige.
MaxISPDGain  = 8192

; Plafond systeme = MaxAGain x MaxISPDGain (15 x 8).
SysGainMax   = 122880

; Pose maximale. Le materiel plafonne a 121215 us (4091 lignes, ~8,2 fps) :
; toute valeur superieure est sans effet, 130000 laisse juste la marge.
MaxExptime   = 130000

; Seuil a partir duquel l'AE s'autorise a rallonger la pose. Le garder BAS est
; essentiel : l'AE pousse alors la pose au maximum (photons reels) avant
; d'ajouter du gain numerique. Un seuil haut fait l'inverse et degrade l'image.
GainThreshold= 16384

Compensation = 52
Tolerance    = 4
Speed        = 64
AEMode       = slow_shutter

; --- Profils de reference (commande `profile <nom>`) -----------------------

; Reglage constructeur d'origine. Reproduit le defaut : a utiliser uniquement
; pour verifier que les traits verticaux reviennent bien.
[AE_Plugin_night_stock]
SysGainMax   = 61440
MaxAGain     = 15872
MaxDGain     = 1024
MaxISPDGain  = 4096
MaxExptime   = 83000
GainThreshold= 16384
Compensation = 52
Tolerance    = 4
Speed        = 64
AEMode       = slow_shutter

; Repli conservateur : moitie moins de gain numerique, image plus sombre mais
; nettement moins bruitee.
[AE_Plugin_night_safe]
SysGainMax   = 61440
MaxAGain     = 15360
MaxDGain     = 1024
MaxISPDGain  = 4096
MaxExptime   = 130000
GainThreshold= 16384
Compensation = 52
Tolerance    = 4
Speed        = 64
AEMode       = slow_shutter

; Jour : pose courte, pas de slow shutter.
[AE_Plugin_day]
SysGainMax   = 15360
MaxAGain     = 15360
MaxDGain     = 1024
MaxISPDGain  = 1024
MaxExptime   = 40000
GainThreshold= 16384
Compensation = 52
Tolerance    = 4
Speed        = 64
AEMode       = fix_framerate
